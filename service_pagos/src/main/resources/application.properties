server.port=8091
spring.application.name=service-pagos

# Conexión a MySQL en XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/db_pagos?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Configuración de Swagger
springdoc.api-docs.path=/api/v1/pagos/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.mvc.cors.allowed-origins=http://localhost:9090
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*
