server:
  port: 9090

jwt:
  secret: "493358340235739058340598340598340598340598340598"

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:9090"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      discovery:
        locator:
          enabled: true
      routes:
        - id: auth-service
          uri: http://localhost:8091
          predicates:
            - Path=/auth/**

        - id: auth-docs
          uri: http://localhost:8091
          predicates:
            - Path=/auth/v3/api-docs

        - id: cliente-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/cliente/**
          filters:
            - AuthenticationFilter

        - id: clientes-docs
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/clientes/v3/api-docs

        - id: producto-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/producto/**

        - id: productos-docs
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/productos/v3/api-docs

        - id: inventario-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/inventarios/**

        - id: inventarios-docs
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/inventarios/v3/api-docs

        - id: pedido-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/pedidos/**

        - id: pedidos-docs
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/pedidos/v3/api-docs

        - id: detalle-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/detalle/**

        - id: detalles-docs
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/detalles/v3/api-docs

        - id: precios-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/v1/precios/**

        - id: precios-docs
          uri: http://localhost:8089
          predicates:
            - Path=/api/v1/precios/v3/api-docs

        - id: notificacion-service
          uri: http://localhost:8090
          predicates:
            - Path=/api/v1/notificaciones/**

        - id: notificacion-docs
          uri: http://localhost:8090
          predicates:
            - Path=/api/v1/notificaciones/v3/api-docs


eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

springdoc:
  swagger-ui:
    urls:
      - name: Servicio Auth
        url: /auth/v3/api-docs
      - name: Servicio Clientes
        url: /api/v1/clientes/v3/api-docs
      - name: Servicio Productos
        url: /api/v1/productos/v3/api-docs
      - name: Servicio Inventarios
        url: /api/v1/inventarios/v3/api-docs
      - name: Servicio Pedidos
        url: /api/v1/pedidos/v3/api-docs
      - name: Servicio Detalles
        url: /api/v1/detalles/v3/api-docs
      - name: Servicio Precios
        url: /api/v1/precios/v3/api-docs
      - name: Servicio Notificacion
        url: /api/v1/notificaciones/v3/api-docs

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG
