server:
  port: 9090
  
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
          cors-configurations:
            '[/**]':
              allowedOrigins: "http://localhost:9090" # Permite al propio Swagger del gateway
              allowedMethods:
                - GET
                - POST
                - PUT
                - DELETE
                - OPTIONS
              allowedHeaders: "*"
      routes:
        # RUTA PARA EL SERVICIO DE clientes
        - id: cliente-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/cliente/**

        - id: clientes-docs
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/clientes/v3/api-docs


        - id: producto-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/producto/**
        
        - id: productos-docs
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/productos/v3/api-docs


        - id: inventario-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/inventarios/**
        
        - id: inventarios-docs
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/inventarios/v3/api-docs


        - id: pedido-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/pedidos/**

        - id: pedidos-docs
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/pedidos/v3/api-docs


        - id: detalle-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/detalle/**
        
        - id: detalles-docs
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/detalles/v3/api-docs
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

springdoc:
  swagger-ui:
    urls:
      - name: Servicio clientes
        url: /api/v1/clientes/v3/api-docs
      - name: Servicio Productos
        url: /api/v1/productos/v3/api-docs
      - name: Servicio Inventarios
        url: /api/v1/inventarios/v3/api-docs
      - name: Servicio Pedidos
        url: /api/v1/pedidos/v3/api-docs
      - name: Servicio Detalles
        url: /api/v1/detalles/v3/api-docs


            
