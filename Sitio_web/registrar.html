<!DOCTYPE html>
<html lang="es">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Quesería</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <nav class="nav-links">
        <a href="index.html" class="boton-home-nav">Home</a>
    </nav>
    <div class="formulario-registro">
        
        <div class="titulo-registro">
            <div class="queso">🧀</div>
            <h2>Crear Cuenta</h2>
            <p>Únete y disfruta de los mejores quesos artesanales</p>
        </div>
            
            <div class="formulario-registrar">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Nombre Apellido">
            </div>

            <div class="formulario-registrar">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" required placeholder="correo@ejemplo.com">
            </div>

            <div class="formulario-registrar">
                <label for="telefono">Teléfono de Contacto</label>
                <input type="tel" id="telefono" name="telefono" required placeholder="+56 9 1234 5678">
            </div>

            <div class="formulario-registrar">
                <label for="direccion">Dirección de Envío</label>
                <input type="text" id="direccion" name="direccion" required placeholder="Calle, número">
            </div>

            <div class="formulario-registrar">
                <label for="ciudad">Ciudad / Comuna</label>
                <input type="text" id="ciudad" name="ciudad" required placeholder="Ej: Santiago, Maipú, etc">
            </div>

            <div class="formulario-registrar">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" required placeholder="••••••••">
            </div>

            <div class="formulario-registrar">
                <label for="confirmarContrasena">Confirmar Contraseña</label>
                <input type="password" id="confirmarContrasena" name="confirmarContrasena" required placeholder="••••••••">
            </div>

            <div class="checkbox">
                <label>
                    <input type="checkbox" id="terminos" name="terminos" required> 
                    Acepto los <a href="#">términos y condiciones</a>
                </label>
            </div>

            <button type="submit" class="boton-registrar">Registrarse</button>

            <div class="pie-pagina">
                ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a>
            </div>
        </form>
    </div>
</body>
</html>
