<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="estilos.css">

    <title>Iniciar Sesión | Quesería Sin Ti Maipú </title>
</head>

<body>

    <header class="navbar">

        <div class="logo">
            <div class="logo-icon">🧀</div>

            <div class="logo-text">
                <h1>Quesería</h1>
                <span>Sin Ti Maipú</span>
            </div>
        </div>

        <nav class="nav-links" id="nav-links">

            <a href="Index.html">Home</a>

            <a href="Nosotros.html">Nosotros</a>

            <a href="Contacto.html">Contacto</a>
        </nav>

    </header>

    <main class="login-section">

        <div class="login-card">


            <div class="login-header">

                <div class="cheese-icon">
                    🧀
                </div>

                <h2>Bienvenido a La Quesería</h2>

                <p>
                    Inicia sesión para disfrutar de nuestros productos.
                </p>

            </div>



            <form id="loginForm" novalidate>

                <div class="form-group">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        maxlength="100"
                        placeholder="ejemplo@gmail.com"
                        autocomplete="email"
                    >

                    <small id="errorCorreo" class="mensaje-error"></small>

                </div>


                <div class="form-group">

                    <label for="contrasena">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        minlength="4"
                        maxlength="10"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="current-password"
                    >

                    <small id="errorContrasena" class="mensaje-error"></small>

                </div>



                <button type="submit" class="btn-login">
                    Iniciar Sesión
                </button>


                <p id="mensajeExito" class="mensaje-exito"></p>

            </form>


            <div class="registro">

                <p>¿Aún no tienes una cuenta?</p>

                <a href="registrar.html"> Crear una cuenta </a>

            </div>

        </div>

    </main>
</body>
</html>
