spring.application.name=service-detalle
server.port=8085
spring.datasource.url=jdbc:mysql://localhost:3306/db_detalle?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Ruta donde se generará el JSON de la documentación
springdoc.api-docs.path=/api/v1/detalles/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.mvc.cors.allowed-origins=http://localhost:9090
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*